name: Rust CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Linting checks
      run: make lint
    - name: Run tests
      run: RUST_BACKTRACE=full make test
    - name: Documentation checks
      run: make docs
    - name: Build
      run: make build

# REFERENCES:
# > https://github.com/rust-github/template/blob/main/template/.github/workflows/ci.yml
